name: Deploy gateway

# Redeploys the Telegram gateway to ECS Fargate whenever gateway-relevant
# code lands on main: rebuilds the image, pushes it to ECR, and forces a
# new ECS deployment. See deploy/gateway/README.md for the manual version
# of these same steps and the getUpdates-409-conflict background.
#
# Security notes (this repo may go public — see deploy/iam/README.md
# "GitHub Actions (OIDC)"):
# - Deliberately triggers on `push` only, never `pull_request` or
#   `pull_request_target` — so it never runs on unreviewed code from a fork
#   PR. main is branch-protected (PRs required, CI must pass), so reaching
#   this trigger already implies review.
# - Authenticates to AWS via OIDC (aws-actions/configure-aws-credentials),
#   not a stored long-lived access key — nothing static to leak. The
#   assumed role's trust policy is scoped to this exact repo + the main
#   branch, and its permissions are scoped to exactly two things: pushing
#   images to the cos-gateway ECR repo, and updating the cos-gateway ECS
#   service. See deploy/iam/github-actions-*.json.
# - All third-party actions are pinned to a commit SHA, not a mutable tag.

on:
  push:
    branches: [main]
    paths:
      - "src/cos/**"
      - "!src/cos/webapp/**"
      - "pyproject.toml"
      - "household.json"
      - "deploy/gateway/Dockerfile"
      - ".github/workflows/deploy-gateway.yml"

permissions:
  id-token: write # required to request the OIDC token
  contents: read

concurrency:
  group: deploy-gateway
  # Never run two deploys at once — the gateway is a single long-poll
  # process, and overlapping force-new-deployment calls (or a mid-flight
  # docker push racing a second one) can only cause confusing rollouts.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.GATEWAY_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7
        id: ecr

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push gateway image
        run: |
          docker buildx build --platform linux/arm64 \
            -f deploy/gateway/Dockerfile \
            -t "${{ steps.ecr.outputs.registry }}/cos-gateway:${{ github.sha }}" \
            -t "${{ steps.ecr.outputs.registry }}/cos-gateway:latest" \
            --push .

      - name: Force new ECS deployment
        run: |
          aws ecs update-service --cluster cos-cluster --service cos-gateway \
            --force-new-deployment --region eu-central-1

      - name: Wait for the new task to become stable
        run: |
          aws ecs wait services-stable --cluster cos-cluster --services cos-gateway \
            --region eu-central-1
