<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CoS agent-invocation path, default versus fallback: the gateway is unchanged either way, but the agent call defaults to Bedrock AgentCore Runtime backed by Amazon Bedrock and DynamoDB, with a fallback to an in-process Strands Agent against the Anthropic API and local SQLite.">
  <title>CoS agent-invocation path — default vs. fallback</title>
  <desc>The Telegram gateway calls a Strands Agent. By default that call is routed through Amazon Bedrock AgentCore Runtime, backed by Amazon Bedrock and DynamoDB. A fallback path runs the same agent in-process instead, talking directly to the Anthropic API and a local SQLite file.</desc>

  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>

  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Telegram -->
  <rect x="370" y="20" width="260" height="44" rx="6" fill="#f8fafc" stroke="#334155"/>
  <text x="500" y="46" text-anchor="middle" font-size="13" fill="#1e293b" font-family="sans-serif">Telegram Group Chat</text>

  <line x1="500" y1="64" x2="500" y2="94" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Gateway -->
  <rect x="300" y="96" width="400" height="80" rx="6" fill="#f8fafc" stroke="#334155"/>
  <text x="500" y="121" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b" font-family="sans-serif">Gateway process (long-running, unchanged)</text>
  <text x="500" y="141" text-anchor="middle" font-size="11" fill="#475569" font-family="sans-serif">long-poll listener</text>
  <text x="500" y="157" text-anchor="middle" font-size="11" fill="#475569" font-family="sans-serif">daily nudge + weekly metrics schedulers</text>

  <!-- Column headers -->
  <text x="250" y="209" text-anchor="middle" font-size="11" font-weight="600" fill="#475569" font-family="sans-serif">FALLBACK — local dev</text>
  <text x="750" y="209" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8" font-family="sans-serif">DEFAULT — deployed</text>

  <!-- Split arrows -->
  <line x1="360" y1="176" x2="250" y2="228" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="270" y="196" text-anchor="middle" font-size="10.5" fill="#475569" font-family="sans-serif">in-process call</text>

  <line x1="640" y1="176" x2="750" y2="228" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="770" y="196" text-anchor="middle" font-size="10.5" fill="#1d4ed8" font-family="sans-serif">invoke_agent_runtime()</text>

  <!-- Left branch: today -->
  <rect x="90" y="230" width="320" height="60" rx="6" fill="#f8fafc" stroke="#334155"/>
  <text x="250" y="265" text-anchor="middle" font-size="13" fill="#1e293b" font-family="sans-serif">Strands Agent (in-process)</text>

  <line x1="165" y1="290" x2="165" y2="358" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="173" y="326" text-anchor="start" font-size="10.5" fill="#475569" font-family="sans-serif">model calls</text>

  <line x1="335" y1="290" x2="335" y2="358" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="343" y="326" text-anchor="start" font-size="10.5" fill="#475569" font-family="sans-serif">reads/writes</text>

  <rect x="90" y="360" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155"/>
  <text x="165" y="380" text-anchor="middle" font-size="12" fill="#1e293b" font-family="sans-serif">Anthropic API</text>
  <text x="165" y="396" text-anchor="middle" font-size="11" fill="#475569" font-family="sans-serif">(Claude)</text>

  <rect x="260" y="360" width="150" height="50" rx="6" fill="#f8fafc" stroke="#334155"/>
  <text x="335" y="380" text-anchor="middle" font-size="12" fill="#1e293b" font-family="sans-serif">SQLite</text>
  <text x="335" y="396" text-anchor="middle" font-size="11" fill="#475569" font-family="sans-serif">(local file)</text>

  <!-- Right branch: target -->
  <rect x="590" y="230" width="320" height="100" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="750" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8" font-family="sans-serif">AgentCore Runtime (serverless container)</text>
  <rect x="610" y="262" width="280" height="48" rx="4" fill="#ffffff" stroke="#2563eb"/>
  <text x="750" y="291" text-anchor="middle" font-size="12" fill="#1d4ed8" font-family="sans-serif">Strands Agent (brain)</text>

  <line x1="665" y1="330" x2="665" y2="358" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="673" y="346" text-anchor="start" font-size="10.5" fill="#1d4ed8" font-family="sans-serif">model calls</text>

  <line x1="835" y1="330" x2="835" y2="358" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="843" y="346" text-anchor="start" font-size="10.5" fill="#1d4ed8" font-family="sans-serif">reads/writes</text>

  <rect x="590" y="360" width="150" height="50" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="665" y="380" text-anchor="middle" font-size="12" fill="#1d4ed8" font-family="sans-serif">Amazon Bedrock</text>
  <text x="665" y="396" text-anchor="middle" font-size="11" fill="#1d4ed8" font-family="sans-serif">(Claude)</text>

  <rect x="760" y="360" width="150" height="50" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="835" y="380" text-anchor="middle" font-size="12" fill="#1d4ed8" font-family="sans-serif">DynamoDB</text>
  <text x="835" y="396" text-anchor="middle" font-size="11" fill="#1d4ed8" font-family="sans-serif">(tasks table)</text>
</svg>
