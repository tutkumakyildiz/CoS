<svg viewBox="0 0 1050 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CoS architecture: a long-running gateway process polls Telegram and invokes a Strands Agent running in Amazon Bedrock AgentCore Runtime per message. The agent calls Amazon Bedrock for the model and DynamoDB for task storage, and sends its reply directly back to Telegram itself.">
  <title>CoS architecture</title>
  <desc>The Telegram gateway (long-poll listener plus daily-nudge and weekly-metrics schedulers) invokes a deployed Bedrock AgentCore Runtime container per message via invoke_agent_runtime. Inside the container, a Strands Agent runs its tool-calling loop against three tools — task_store, telegram_tools, and a permanently-stubbed calendar_tool — calling Amazon Bedrock for the model and DynamoDB for task storage, and sending its reply straight back to Telegram itself, not through the gateway.</desc>

  <rect x="0" y="0" width="1050" height="560" fill="#ffffff"/>

  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Telegram -->
  <rect x="310" y="20" width="280" height="50" rx="8" fill="#f8fafc" stroke="#334155"/>
  <text x="450" y="50" text-anchor="middle" font-size="13" fill="#1e293b" font-family="sans-serif">Telegram Group Chat</text>

  <line x1="450" y1="70" x2="450" y2="100" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="462" y="88" text-anchor="start" font-size="10.5" fill="#475569" font-family="sans-serif">long-poll</text>

  <!-- Gateway -->
  <rect x="230" y="102" width="440" height="92" rx="8" fill="#f8fafc" stroke="#334155"/>
  <text x="450" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b" font-family="sans-serif">Gateway process (long-running)</text>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#475569" font-family="sans-serif">Telegram long-poll listener + callback routing</text>
  <text x="450" y="166" text-anchor="middle" font-size="11" fill="#475569" font-family="sans-serif">daily-nudge + weekly-metrics schedulers (JobQueue)</text>
  <text x="450" y="184" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="sans-serif">telegram_bot/bot.py</text>

  <line x1="450" y1="194" x2="450" y2="222" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="462" y="212" text-anchor="start" font-size="10.5" fill="#1d4ed8" font-family="sans-serif">invoke_agent_runtime()</text>

  <!-- AgentCore Runtime -->
  <rect x="150" y="224" width="650" height="182" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="475" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8" font-family="sans-serif">Bedrock AgentCore Runtime (deployed container)</text>
  <text x="475" y="264" text-anchor="middle" font-size="10" fill="#3b82f6" font-family="sans-serif">runtime_entrypoint.py — one invocation per message</text>

  <rect x="180" y="274" width="590" height="42" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="475" y="300" text-anchor="middle" font-size="12" fill="#1d4ed8" font-family="sans-serif">Strands Agent (brain.py / agent.py) — system prompt + tool-calling loop</text>

  <!-- tool chips -->
  <rect x="190" y="330" width="185" height="40" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="282" y="354" text-anchor="middle" font-size="11" fill="#1e40af" font-family="sans-serif">task_store</text>

  <rect x="387" y="330" width="185" height="40" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="479" y="354" text-anchor="middle" font-size="11" fill="#1e40af" font-family="sans-serif">telegram_tools</text>

  <rect x="584" y="330" width="185" height="40" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-dasharray="4 3"/>
  <text x="676" y="349" text-anchor="middle" font-size="11" fill="#1e40af" font-family="sans-serif">calendar_tool</text>
  <text x="676" y="362" text-anchor="middle" font-size="9.5" fill="#60a5fa" font-family="sans-serif">(permanent stub)</text>

  <line x1="282" y1="370" x2="282" y2="398" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="479" y1="370" x2="479" y2="398" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <text x="290" y="390" text-anchor="start" font-size="10" fill="#1d4ed8" font-family="sans-serif">model calls</text>
  <text x="487" y="390" text-anchor="start" font-size="10" fill="#1d4ed8" font-family="sans-serif">reads/writes</text>

  <!-- Bedrock + DynamoDB -->
  <rect x="192" y="446" width="180" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="282" y="472" text-anchor="middle" font-size="12" fill="#1d4ed8" font-family="sans-serif">Amazon Bedrock</text>
  <text x="282" y="490" text-anchor="middle" font-size="11" fill="#1d4ed8" font-family="sans-serif">(Claude)</text>

  <rect x="389" y="446" width="180" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="479" y="472" text-anchor="middle" font-size="12" fill="#1d4ed8" font-family="sans-serif">DynamoDB</text>
  <text x="479" y="490" text-anchor="middle" font-size="11" fill="#1d4ed8" font-family="sans-serif">cos_tasks table</text>

  <!-- calendar_tool stub note -->
  <text x="676" y="390" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="sans-serif">always reports "not connected"</text>

  <!-- Reply path, straight back to Telegram, bypassing the gateway (orthogonal routing so it can't cross the label) -->
  <path d="M 800,295 L 840,295 L 840,45 L 592,45" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>

  <text x="850" y="130" text-anchor="start" font-size="10.5" fill="#475569" font-family="sans-serif">send_message /</text>
  <text x="850" y="143" text-anchor="start" font-size="10.5" fill="#475569" font-family="sans-serif">ask_choice</text>
  <text x="850" y="164" text-anchor="start" font-size="9.5" fill="#94a3b8" font-family="sans-serif">(reply goes directly</text>
  <text x="850" y="177" text-anchor="start" font-size="9.5" fill="#94a3b8" font-family="sans-serif">to Telegram — the</text>
  <text x="850" y="190" text-anchor="start" font-size="9.5" fill="#94a3b8" font-family="sans-serif">gateway isn't involved)</text>

  <!-- Fallback footnote -->
  <text x="450" y="530" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-family="sans-serif">Fallback (COS_AGENT_MODE=local, COS_MODEL_PROVIDER=anthropic, COS_PERSISTENCE_BACKEND=sqlite): the gateway runs the same Strands Agent</text>
  <text x="450" y="546" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-family="sans-serif">in-process instead, calling the Anthropic API directly and reading/writing a local SQLite file — no AgentCore, Bedrock, or DynamoDB involved.</text>
</svg>
